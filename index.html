const D={"L":[["g","Greenhaven","Town","",1,0,"A walled farming town at the edge of the forest. The party was hired here by Mayor Green. The only road west to Cairnhold is cut.","",""],["w","The Westwood Track","Wilderness","",1,1,"The forest track the party followed from Greenhaven. They killed a goblin scout and three skeletons here, and Gorath appeared.","",""],["nr","The West Road","Road","",1,0,"The only road between Greenhaven and Cairnhold. It is cut, and the beer in Greenhaven is running out.","",""],["th","Town Hall","Building","",1,0,"Where the party found Gordon and Carlos charmed him. Wick found records of letters between Greenhaven and Cairnhold here.","","g"],["st","The Wandering Stag","Building","",1,0,"The town tavern, owned by Roll. Beer is running out because the west road is cut. The party spoke to Roll, the waitress and the guardsmen Will and Grave here, and heard about Fred, the one man who came back.","","g"],["fg","Front Gate","Building","",1,0,"Where the party left town. Cobb met them here with his wagon.","","g"],["mh","The Mayor's House","Building","",1,0,"Where the party met Mayor Green, standing on his porch and looking west over the wall toward the forest. Gordon had left items in a chest for them here.","","g"]],"N":[["Mayor Thaddeus Green","Mayor of Greenhaven, quest giver","mh",["mh"],"","Unknown",1,"Mid-50s, brown-skinned and weathered, with keen eyes. Grey at the temples and strong through the shoulders.","Asked the party to find out why the west road is cut and what happened to the four people he sent to investigate. Only Fred came back.","",""],["Gordon","Court wizard, the mayor's right hand","g",["th"],"","Unknown",1,"","The mayor's right hand. He left items in a chest at the mayor's house for the party. Carlos charmed him at the town hall, and he confirmed one road links Greenhaven and Cairnhold.","",""],["Cobb","Master of the stable","sb",["mh","fg"],"","Unknown",1,"","Zeph and Wick know him from an old supply-line job. He drove the party most of the way to the forest.","",""],["Roll","Owner of the Wandering Stag","st",["st"],"","Unknown",1,"Male tiefling, stocky, with a big belly.","Owns the Wandering Stag. His beer is running out because the west road is cut.","",""],["The waitress","Waitress at the Wandering Stag","st",["st"],"","Unknown",1,"A human girl.","Waits tables at the Stag. The party hasn't asked her name yet.","",""],["Will","Guardsman","g",["st"],"","Unknown",1,"","Shared information at the tavern.","",""],["Grave","Guardsman","g",["st"],"","Unknown",1,"","Shared information at the tavern.","",""],["Gorath","Giant of the forest","w",["w"],"","Unknown",1,"A twelve-foot giant.","Appeared after the skeleton fight and said only: St. Maren's Church.","",""]]};
const $=q=>document.querySelector(q),NS="http://www.w3.org/2000/svg",esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ROOF=[['#b9654a','#8f4630'],['#a9744d','#7f5233'],['#c7a36a','#a07f45'],['#9c5b43','#733d2b']],MAP={'#d3bb85':'#e8e0c8','#e0cd9c':'#c9a76a','#b99a64':'#a0522d','#c4a870':'#9a6a45','#cdb27a':'#b88a5a','#8a7447':'#7d7a3f','#7a6238':'#9d9272','#c9cc9a':'#a9b86a','#a9b5a5':'#7c93b0','#e9dab0':'#e8e0c8'},E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,MAP[a[k]]||a[k]);if(p)p.appendChild(e);return e};

const vis=o=>!!(o&&o.d);

trees($("#wt"),75,()=>{let x,y;do{const a=R()*6.28,r=Math.sqrt(R());x=215+Math.cos(a)*r*190;y=385+Math.sin(a)*r*125}while(Math.hypot(x-200,(y-392)*1.4)<62);return[x,y,.8+R()*.6]});

P.innerHTML=h}
function dflt(){P.innerHTML=`<h2>${view=="town"?"Greenhaven":"The Marches of Greenhaven"}</h2><p>Click a name on the map to read its entry. ${mode=="dm"?"Fog hides what the party hasn't found. Dashed outlines are places they haven't discovered, shown to you only.":"This is what your players will see."}</p>`+(view=="town"?"":`<p><button class="btn on" id=enter>Enter Greenhaven ›</button></p>`)}
